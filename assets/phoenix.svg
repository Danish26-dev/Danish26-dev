<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MD Danish Ali - Build, experiment, iterate, ship</title>
  <desc id="desc">A deep-blue developer hero with a red-orange phoenix rising through cyan water, surrounded by restrained energy particles.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040B19"/>
      <stop offset="0.58" stop-color="#071C35"/>
      <stop offset="1" stop-color="#0A2945"/>
    </linearGradient>
    <linearGradient id="water" x1="720" y1="286" x2="720" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E7490" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#082F49" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="wing" x1="610" y1="168" x2="1010" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="fire" x1="800" y1="122" x2="800" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.26" stop-color="#FB923C"/>
      <stop offset="0.7" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" stroke="#38BDF8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fireGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#sky)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="860" cy="226" r="170" fill="#0EA5E9" fill-opacity="0.08" filter="url(#blueGlow)"/>

    <g fill="#67E8F9" opacity="0.65">
      <circle cx="660" cy="104" r="2"><animate attributeName="cy" values="104;72;104" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="116" r="2"><animate attributeName="cy" values="116;78;116" dur="5.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="238" r="1.5"><animate attributeName="cy" values="238;198;238" dur="4.7s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="626" cy="260" r="1.5"><animate attributeName="cy" values="260;222;260" dur="4.3s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <g fill="#0C4A6E" opacity="0.65">
      <path d="M520 342C620 325 690 362 780 343C860 326 940 352 1080 330V440H520V342Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;18 0;0 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M460 368C570 346 660 386 760 366C865 345 985 383 1150 354V440H460V368Z" fill="url(#water)"/>
    </g>
    <path d="M520 355C610 338 677 370 764 353C850 337 936 370 1084 346" stroke="#67E8F9" stroke-opacity="0.4" stroke-width="2">
      <animate attributeName="d" values="M520 355C610 338 677 370 764 353C850 337 936 370 1084 346;M520 355C610 370 677 338 764 355C850 370 936 337 1084 346;M520 355C610 338 677 370 764 353C850 337 936 370 1084 346" dur="8s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(808 255)" filter="url(#blueGlow)">
      <animateTransform attributeName="transform" type="translate" values="808 255;808 244;808 255" dur="6s" repeatCount="indefinite"/>
      <g fill="url(#wing)" opacity="0.95">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-4 0 0;3 0 0;-4 0 0" dur="5.5s" repeatCount="indefinite"/>
          <path d="M-24 -68C-88 -128-180 -144-264 -111C-207 -75-168 -29-143 22C-202 4-246 11-294 42C-222 58-161 96-104 154C-62 114-38 70-24 26L-106 69C-71 26-42-21-24-68Z"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="4 0 0;-3 0 0;4 0 0" dur="5.5s" repeatCount="indefinite"/>
          <path d="M24 -68C88 -128 180 -144 264 -111C207 -75 168 -29 143 22C202 4 246 11 294 42C222 58 161 96 104 154C62 114 38 70 24 26L106 69C71 26 42-21 24-68Z"/>
        </g>
      </g>
      <g filter="url(#fireGlow)">
        <path d="M0 -122L-23 -83L0 -94L23 -83L0 -122Z" fill="#F97316"/>
        <path d="M0 -94C-34 -57-37 3-22 43C-15 62-26 91-57 132C-23 117-6 103 0 78C6 103 23 117 57 132C26 91 15 62 22 43C37 3 34-57 0-94Z" fill="url(#fire)"/>
        <path d="M0 -60V82M-22 43L0 28L22 43" stroke="#FEF3C7" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round"/>
        <path d="M-51 132C-31 144-14 149 0 151C14 149 31 144 51 132" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <g fill="#FB923C" filter="url(#fireGlow)">
      <circle cx="754" cy="310" r="3"><animate attributeName="cy" values="310;270;310" dur="4.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="867" cy="304" r="2.5"><animate attributeName="cy" values="304;258;304" dur="4.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="808" cy="110" r="2"><animate attributeName="cy" values="110;76;110" dur="3.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="82" y="82" width="58" height="5" rx="2.5" fill="#22D3EE"/>
      <text x="82" y="154" fill="#F8FAFC" font-size="54" font-weight="700" letter-spacing="3">MD DANISH ALI</text>
      <text x="86" y="198" fill="#A5F3FC" font-size="20" letter-spacing="2">SOFTWARE ENGINEERING STUDENT  /  AI BUILDER</text>
      <text x="86" y="250" fill="#E2E8F0" font-size="25">Turning ambitious ideas into working systems.</text>
      <text x="86" y="312" fill="#67E8F9" font-family="Consolas, monospace" font-size="16" letter-spacing="1">BUILD  -  EXPERIMENT  -  ITERATE  -  SHIP</text>
      <path d="M86 350H440" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
      <text x="86" y="382" fill="#94A3B8" font-family="Consolas, monospace" font-size="13">AI  /  FULL-STACK  /  WEB3</text>
    </g>
  </g>
</svg>
